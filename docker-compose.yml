services:

  backend:
    build:
      context: ./wandr-backend
    container_name: wandr-backend
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: frontend
    container_name: wandr-frontend
    env_file:
      - .env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  db:
    image: postgis/postgis:16-3.4
    container_name: wandr-postgis
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U wandruser -d wandrdb" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: